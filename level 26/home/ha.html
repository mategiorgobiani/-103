<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Selectors</title>
    <link rel="stylesheet" href="ca.css">
</head>
<body>

<h2>1. :link</h2>
<a href="https://www.google.com" target="_blank">Google</a>

<h2>2. :visited</h2>
<a href="https://www.youtube.com" target="_blank">YouTube</a>

<h2>3. :hover</h2>
<a href="#">Hover Me</a>

<h2>4. :active</h2>
<a href="#">Click Me</a>

<h2>5. :focus</h2>
<a href="#" tabindex="1">Focus Me (Tab)</a>

</body>
</html>
