<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Examples</title>
    <link rel="stylesheet" href="cs.css">
</head>
<body>

    <h2>is</h2>
    <p>He is a student.</p>
    <p>She is happy.</p>

    <h2>has</h2>
    <p>He has a car.</p>
    <p>She has a cat.</p>

    <h2>where</h2>
    <p>Where do you live?</p>
    <p>Where is my phone?</p>

    <h2>backdrop-filter</h2>
    <div class="box1">Blur</div>
    <div class="box2">Brightness</div>

    <h2>object-fit</h2>
    <img class="image1" src="https://picsum.photos/300/200">
    <img class="image2" src="https://picsum.photos/300/200">

    <h2>position</h2>
    <div class="box3">Relative</div>
    <div class="box4">Absolute</div>

</body>
</html>
