<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <div class="image">
        <img src="image-equilibrium.jpg" alt="Cube">
    </div>

    <div class="content">
        <h3>Equilibrium #3429</h3>

        <p>
            Our Equilibrium collection promotes
            balance and calm.
        </p>

        <div class="info">

            <div class="left">
              <img width="8px" src="icon-ethereum.svg" alt="">
                <span> 0.041 ETH</span>
            </div>

            <div class="right">
                 <img src="icon-clock.svg" alt="">
                <span> 3 days left</span>
            </div>

        </div>

        <hr>

        <div class="creator">
            <img src="image-avatar.png" alt="Avatar">
            <span>Creation of <b>Jules Wyvern</b></span>
        </div>

    </div>

</div>

</body>
</html>
