<!DOCTYPE html>
<html>
<head>
    <title>Audio Video Dropdown</title>
</head>
<body>

    <h2>Audio</h2>
    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <h2>Video</h2>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h2>Dropdown List</h2>
    <select>
        <option>მანქანა</option>
        <option>მშია</option>
        <option>კაკები</option>
        <option>ბებიკოს ფუნთუშები</option>
    </select>

</body>
</html>
