<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="stylesheet" href="seal.css">
</head>
<body>
    <div>
        <img width="300px" src="https://img.icons8.com/color/512/css3.png" alt="">
        <img width="300px"  src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/ISO_C%2B%2B_Logo.svg/1920px-ISO_C%2B%2B_Logo.svg.png" alt="">
        <img width="300px" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Python-logo-notext.svg/250px-Python-logo-notext.svg.png" alt="">
            

    </div>

    <main>
        <header>
            <h1>Registration Website</h1>
            <p>Create your account</p>
        </header>
         
        <form>
            <h2>personal information</h2>
          

            <label for="fname">First name</label>
            <input type="text" name="fname" id="fname">

            <label for="lname">last name</label>
            <input type="text" name="lname" id="lname">

            <label for="username">Username</label>
            <input type="text" name="username" id="username">

            <label for="email">email</label>
            <input type="email" name="email" id="email">

            <label for="password">password</label>
            <input type="password" name="password" id="password">

            <label for="confrim">confrim password</label>
            <input type="password" name="confrim" id="confrim">

            <label for="phone">phone number</label>
            <input type="tel" name="phone" id="phone">

            <label for="birth">Date of birth</label>
            <input type="date" name="birth" id="birth">

            <label for="age">age</label>
            <input type="number" name="age" id="age">

            <label for="picture">Profile Picture </label>
            <input type="file" name="Profile" id="Profile">

            <h3>Gender</h3>

            <input type="radio" name="male" id="Gender">
            <label for="male">male</label>

            <input type="radio" name="female" id="Gender">
            <label for="female">female</label>

            <input type="radio" name="other" id="Gender">
            <label for="other">other</label>

            <h3>Education</h3>

            <select>
                <option >School student</option>
                <option > college student</option>
                <option >university student</option>
                <option >Graduate</option>
            </select> 

            <h3>programing languages</h3>

            <input type="checkbox" id="html">
            <label for="html">Html</label>
            
            <input type="checkbox" id="css">
            <label for="css">css</label>

            <input type="checkbox" id="javascript">
            <label for="javascript">javascript</label>

            <input type="checkbox" id="python">
            <label for="python">python</label>

            <input type="checkbox" id="cpp">
            <label for="cpp">c++</label>

            <h3>Country</h3>

            <select>
                <option>Georgia</option>
                <option>Germany</option>
                <option>USA</option>
                <option>China</option>
                <option>Canada</option>
                <option>Brazil</option>
                <option>japan</option>
            </select>
            <br>
            <br>
            <h2>description</h2>
            <label for="checkbox"></label>
            <input type="text">
            
            <input type="checkbox"  id="terms">
            <label for="terms">Acceptt terms</label>
            <br><br>
            <input type="submit"  value="submit">
            <input type="reset"  value="reset">

            <br><br><br>
            




        </form>
    </main>
    </body>
    </html>
